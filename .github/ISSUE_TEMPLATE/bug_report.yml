name: Bug report
description: Report a reproducible problem without secrets
body:
  - type: textarea
    id: environment
    attributes:
      label: Versions and connection type
      description: SteamOS, Decky, plugin, Node, DSH version; LAN / VPN / HTTPS / tunnel. No actual addresses or tokens.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result, actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Remove credentials, account details, machine names and personal conversations before attaching logs or screenshots.
